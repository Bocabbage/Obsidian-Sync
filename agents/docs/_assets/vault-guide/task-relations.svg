<text x="60" y="1093" font-size="20" fill="#6b7280" text-anchor="start" font-weight="400" data-graph-role="label" data-graph-bounds="60.0 1073.0 434.0 1097.0">当天完成 ≠ Task 完成 ≠ Theme 结束</text>
<text x="60" y="1134" font-size="20" fill="#6b7280" text-anchor="start" font-weight="400" data-graph-role="label" data-graph-bounds="60.0 1114.0 438.0 1138.0">专注按每日记录去重并归属到本地 Task。</text>
<text x="60" y="1233" font-size="20" fill="#6b7280" text-anchor="start" font-weight="400" data-graph-role="label" data-graph-bounds="60.0 1213.0 681.2 1237.0">共享来源保留待归属；不重复计时，也不直接推导精确 Theme 工时。</text>
