<text x="60" y="732" font-size="20" fill="#6b7280" text-anchor="start" font-weight="400" data-graph-role="label" data-graph-bounds="60.0 712.0 481.2 736.0">标签提供检索线索，不自动建立 Theme 关系。</text>
<text x="60" y="775" font-size="20" fill="#6b7280" text-anchor="start" font-weight="400" data-graph-role="label" data-graph-bounds="60.0 755.0 562.4 779.0">materials 只放 Raw；学习笔记与成果链接留在正文。</text>
<text x="60" y="1051" font-size="20" fill="#6b7280" text-anchor="start" font-weight="400" data-graph-role="label" data-graph-bounds="60.0 1031.0 680.0 1055.0">实线表示现行关联；箭头表示处理方向。所有编译路径均为按需选择。</text>
<text x="60" y="1090" font-size="20" fill="#6b7280" text-anchor="start" font-weight="400" data-graph-role="label" data-graph-bounds="60.0 1070.0 658.0 1094.0">关联不代表核验、完成或已掌握，也不要求每份材料都进入 Wiki。</text>
